<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>학교 업무 원샷 — 교사 즐겨찾기 포털</title>
  <meta name="description" content="출판사, 나이스, 하이클래스 등 교사 업무 사이트 모음" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">🏫</div>
      <div>
        <h1>학교 업무 원샷</h1>
        <p class="sub">출판사 · 나이스 · 하이클래스 한 번에</p>
      </div>
      <div class="spacer"></div>
      <label class="search">🔍
        <input id="q" type="search" placeholder="사이트 검색 (예: 나이스, 천재, 알림장)" autocomplete="off" />
      </label>
      <button id="favBtn" class="btn" title="즐겨찾기만 보기">★ 즐겨찾기</button>
      <a class="btn" href="instructor.html" style="text-decoration:none">📝 강사카드</a>
      <button id="themeBtn" class="btn">🌙 다크</button>
    </div>
  </header>

  <main class="wrap">
    <div class="filters">
      <div id="cats" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <span id="dbPill" class="pill">⚪ 기본 목록 (DB 미연결)</span>
      <span id="count" class="count"></span>
      <button id="resetBtn" class="btn">초기화</button>
    </div>

    <div id="popular" class="popular" style="display:none"></div>

    <div id="sections"></div>

    <section class="suggest">
      <h2>💡 빠진 사이트 제보하기</h2>
      <p class="muted">선생님들이 보내준 사이트는 검토 후 반영됩니다. DB 연결 후 사용 가능합니다.</p>
      <form id="suggestForm">
        <input id="sgName" type="text" placeholder="사이트 이름 (예: ○○교육 티처)" maxlength="60" />
        <input id="sgUrl" type="url" placeholder="주소 (예: https://...)" maxlength="200" />
        <input id="sgReason" type="text" placeholder="어떤 때 쓰나요? (선택)" maxlength="120" />
        <button class="btn primary" type="submit">제보하기</button>
      </form>
      <p id="suggestMsg" class="muted"></p>
    </section>

    <footer class="footer">
      <p>사이트 목록은 DB 연결 시 Supabase에서 실시간으로, 미연결 시 <code>data/sites.json</code>에서 불러옵니다. 즐겨찾기와 테마는 이 브라우저에 저장됩니다.</p>
      <p>제보된 사이트는 Supabase <code>suggestions</code> 테이블에서 확인하세요.</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
